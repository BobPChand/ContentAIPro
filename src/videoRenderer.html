<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; overflow: hidden; }
#container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
#canvas { display: none; }
#status { color: white; font-size: 16px; text-align: center; padding: 20px; }
#progress { width: 200px; height: 4px; background: #333; border-radius: 2px; margin-top: 12px; overflow: hidden; }
#progressBar { height: 100%; background: #7C3AED; width: 0%; transition: width 0.3s; }
#preview { max-width: 200px; max-height: 350px; border-radius: 8px; margin-top: 12px; display: none; }
</style>
</head>
<body>
<div id="container">
  <div id="status">Preparing video...</div>
  <div id="progress"><div id="progressBar"></div></div>
  <video id="preview" controls playsinline></video>
</div>
<canvas id="canvas"></canvas>
<script>
const THEME = '#7C3AED';
const THEME_LIGHT = '#F3EEFF';
const DARK = '#1a1a1a';
const WHITE = '#ffffff';

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const progressEl = document.getElementById('progressBar');

// Canvas size: 1080x1920 (portrait, TikTok/Reels format)
canvas.width = 1080;
canvas.height = 1920;

let receivedData = null;
let audioBuffer = null;
let isRendering = false;

window.addEventListener('message', (event) => {
  const data = event.data;
  if (data.type === 'render') {
    receivedData = data;
    startRendering();
  }
});

// Also listen for React Native WebView messages
document.addEventListener('message', (event) => {
  try {
    const data = JSON.parse(event.data);
    if (data.type === 'render') {
      receivedData = data;
      startRendering();
    }
  } catch (e) {}
});

async function startRendering() {
  if (!receivedData || isRendering) return;
  isRendering = true;

  const { scenes, audioBase64, brandName } = receivedData;
  
  statusEl.textContent = 'Loading audio...';
  progressEl.style.width = '10%';

  // Load audio
  const audioBytes = Uint8Array.from(atob(audioBase64), c => c.charCodeAt(0));
  const audioCtx = new AudioContext();
  audioBuffer = await audioCtx.decodeAudioData(audioBytes.buffer);
  const totalDuration = audioBuffer.duration;

  progressEl.style.width = '20%';
  statusEl.textContent = 'Rendering scenes...';

  // Prepare canvas capture stream
  const fps = 30;
  const stream = canvas.captureStream(fps);
  
  // Add audio track
  const audioDest = audioCtx.createMediaStreamDestination();
  const source = audioCtx.createBufferSource();
  source.buffer = audioBuffer;
  source.connect(audioDest);
  stream.addTrack(audioDest.stream.getAudioTracks()[0]);

  // Set up MediaRecorder
  const chunks = [];
  const recorder = new MediaRecorder(stream, { 
    mimeType: 'video/mp4',
    videoBitsPerSecond: 4000000,
    audioBitsPerSecond: 192000
  });

  recorder.ondataavailable = (e) => {
    if (e.data.size > 0) chunks.push(e.data);
  };

  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: 'video/mp4' });
    const reader = new FileReader();
    reader.onloadend = () => {
      const base64 = reader.result.split(',')[1];
      progressEl.style.width = '100%';
      statusEl.textContent = 'Video ready!';
      
      // Send back to React Native
      window.ReactNativeWebView?.postMessage(JSON.stringify({
        type: 'video_complete',
        base64: base64,
        size: blob.size,
        duration: totalDuration
      }));
    };
    reader.readAsDataURL(blob);
  };

  // Start recording and audio playback
  recorder.start();
  source.start();

  // Render frames
  const numScenes = scenes.length;
  const timePerScene = totalDuration / numScenes;
  let currentSceneIdx = 0;
  let sceneStartTime = 0;
  const startTime = performance.now();

  function renderFrame() {
    const elapsed = (performance.now() - startTime) / 1000;
    
    if (elapsed >= totalDuration) {
      recorder.stop();
      return;
    }

    // Determine current scene
    const newSceneIdx = Math.min(Math.floor(elapsed / timePerScene), numScenes - 1);
    if (newSceneIdx !== currentSceneIdx) {
      currentSceneIdx = newSceneIdx;
      sceneStartTime = elapsed;
    }

    const scene = scenes[currentSceneIdx];
    const sceneProgress = (elapsed - sceneStartTime) / timePerScene; // 0-1 within scene

    drawScene(scene, sceneProgress, currentSceneIdx, numScenes, brandName);

    // Update progress
    const progress = 20 + (elapsed / totalDuration) * 70;
    progressEl.style.width = progress + '%';

    requestAnimationFrame(renderFrame);
  }

  renderFrame();
}

function drawScene(scene, progress, sceneIdx, totalScenes, brandName) {
  // Clear with gradient background
  const grad = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
  grad.addColorStop(0, THEME);
  grad.addColorStop(0.5, '#5B21B6');
  grad.addColorStop(1, DARK);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Add subtle pattern
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  for (let i = 0; i < 5; i++) {
    const x = (i * 250 + (progress * 100) % 250) - 100;
    const y = (i * 400 + (progress * 100) % 400) - 100;
    ctx.beginPath();
    ctx.arc(x, y, 120, 0, Math.PI * 2);
    ctx.fill();
  }

  // Scene indicator dots at top
  const dotY = 80;
  const dotSpacing = 20;
  const totalDotsWidth = totalScenes * dotSpacing;
  const dotsStartX = (canvas.width - totalDotsWidth) / 2;
  for (let i = 0; i < totalScenes; i++) {
    ctx.beginPath();
    ctx.arc(dotsStartX + i * dotSpacing + dotSpacing/2, dotY, 6, 0, Math.PI * 2);
    ctx.fillStyle = i <= sceneIdx ? WHITE : 'rgba(255,255,255,0.3)';
    ctx.fill();
  }

  // Brand name at top
  if (brandName) {
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.font = '600 32px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(brandName.toUpperCase(), canvas.width / 2, 140);
  }

  // Main scene text with fade-in animation
  const fadeIn = Math.min(progress * 4, 1); // Fade in over first 25% of scene
  const textY = canvas.height / 2;
  
  // Split text into lines that fit
  const maxWidth = canvas.width - 160;
  ctx.font = '700 56px -apple-system, sans-serif';
  const lines = wrapText(ctx, scene, maxWidth);
  const lineHeight = 72;
  const totalTextHeight = lines.length * lineHeight;
  const startY = textY - totalTextHeight / 2 + lineHeight / 2;

  ctx.globalAlpha = fadeIn;
  ctx.fillStyle = WHITE;
  ctx.textAlign = 'center';

  // Slide up effect
  const slideOffset = (1 - fadeIn) * 30;
  
  lines.forEach((line, i) => {
    ctx.fillText(line, canvas.width / 2, startY + i * lineHeight - slideOffset);
  });

  ctx.globalAlpha = 1;

  // Bottom watermark
  ctx.fillStyle = 'rgba(255,255,255,0.4)';
  ctx.font = '500 24px -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Made with ContentAI Pro', canvas.width / 2, canvas.height - 60);

  // Progress bar at bottom
  const barWidth = canvas.width - 200;
  const barX = 100;
  const barY = canvas.height - 120;
  ctx.fillStyle = 'rgba(255,255,255,0.2)';
  ctx.fillRect(barX, barY, barWidth, 4);
  ctx.fillStyle = WHITE;
  ctx.fillRect(barX, barY, barWidth * progress, 4);
}

function wrapText(ctx, text, maxWidth) {
  const words = text.split(' ');
  const lines = [];
  let currentLine = '';

  for (const word of words) {
    const testLine = currentLine ? currentLine + ' ' + word : word;
    const metrics = ctx.measureText(testLine);
    if (metrics.width > maxWidth && currentLine) {
      lines.push(currentLine);
      currentLine = word;
    } else {
      currentLine = testLine;
    }
  }
  if (currentLine) lines.push(currentLine);
  
  // Limit to 6 lines
  return lines.slice(0, 6);
}
</script>
</body>
</html>
